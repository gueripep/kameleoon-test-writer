<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local CRO Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --text-muted: #8b949e;
      --accent-color: #58a6ff;
      --success-color: #3fb950;
      --danger-color: #f85149;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      color: #f0f6fc;
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-active {
      background: rgba(63, 185, 80, 0.15);
      color: var(--success-color);
      border: 1px solid rgba(63, 185, 80, 0.4);
    }

    .status-disabled {
      background: rgba(248, 81, 73, 0.15);
      color: var(--danger-color);
      border: 1px solid rgba(248, 81, 73, 0.4);
    }

    .status-connecting {
      background: rgba(210, 153, 34, 0.15);
      color: #d29922;
      border: 1px solid rgba(210, 153, 34, 0.4);
    }

    .status-disconnected {
      background: rgba(139, 148, 158, 0.15);
      color: var(--text-muted);
      border: 1px solid rgba(139, 148, 158, 0.4);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .experiment-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .workspace-name {
      font-weight: 600;
      color: #f0f6fc;
    }

    .workspace-path {
      font-size: 11px;
      color: var(--text-muted);
      word-break: break-all;
    }

    .file-list, .tab-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-item, .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .file-icon { color: var(--accent-color); }
    .tab-icon { color: var(--text-muted); }

    .tab-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-title {
      color: #f0f6fc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-url {
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #30363d;
      transition: .3s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--accent-color); }
    input:checked + .slider:before { transform: translateX(22px); }



    .empty-state {
      font-size: 12px;
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>CRO Bridge</h1>
      <div style="display: flex; gap: 6px;">
        <span id="daemon-badge" class="status-badge status-disconnected">Daemon: Off</span>
      </div>
    </header>

    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <div style="font-weight: 600;">Enable injection</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="card" id="workspace-card">
      <div class="section-title">Active Folder</div>
      <div class="experiment-info" id="workspace-info">
        <div class="workspace-name" id="workspace-name">No workspace connected</div>
        <div class="workspace-path" id="workspace-path">-</div>
      </div>
    </div>

    <div class="card" id="files-card">
      <div class="section-title">Watched Files</div>
      <ul class="file-list" id="file-list">
        <li class="empty-state">No files being watched</li>
      </ul>
    </div>



    <div class="card" id="injections-card">
      <div class="section-title">Active Injections</div>
      <ul class="tab-list" id="tab-list">
        <li class="empty-state">No active injections</li>
      </ul>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
