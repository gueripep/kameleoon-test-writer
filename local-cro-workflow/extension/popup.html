<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local CRO Bridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Mono:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:           #1d342f;
      --card-bg:      rgba(255, 255, 255, 0.07);
      --card-border:  rgba(255, 255, 255, 0.12);
      --text:         #ffffff;
      --text-muted:   rgba(255, 255, 255, 0.55);
      --lime:         #dae995;
      --lime-bg:      rgba(218, 233, 149, 0.15);
      --lime-border:  rgba(218, 233, 149, 0.35);
      --red:          #af464e;
      --red-bg:       rgba(175, 70, 78, 0.15);
      --red-border:   rgba(175, 70, 78, 0.35);
      --amber:        #c8a84b;
      --amber-bg:     rgba(200, 168, 75, 0.15);
      --amber-border: rgba(200, 168, 75, 0.35);
      --neutral-bg:   rgba(255, 255, 255, 0.1);
      --neutral-border: rgba(255, 255, 255, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      background: var(--lime);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--bg);
      letter-spacing: -0.5px;
    }

    .logo-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 400;
      font-family: 'Noto Sans Mono', monospace;
      letter-spacing: 0.5px;
    }

    .status-badge {
      font-family: 'Noto Sans Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.96px;
      white-space: nowrap;
    }

    .status-active {
      background: var(--lime-bg);
      color: var(--lime);
      border: 1px solid var(--lime-border);
    }

    .status-disabled {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid var(--red-border);
    }

    .status-connecting {
      background: var(--amber-bg);
      color: var(--amber);
      border: 1px solid var(--amber-border);
    }

    .status-disconnected {
      background: var(--neutral-bg);
      color: var(--text-muted);
      border: 1px solid var(--neutral-border);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
    }

    .section-label {
      font-family: 'Noto Sans Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.12px;
      margin-bottom: 10px;
    }

    /* Toggle row */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: rgba(255, 255, 255, 0.15);
      transition: .25s;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background: rgba(255, 255, 255, 0.7);
      transition: .25s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background: var(--lime-bg);
      border-color: var(--lime-border);
    }

    input:checked + .slider:before {
      background: var(--lime);
      transform: translateX(18px);
    }

    /* Target tab */
    .target-btn {
      width: 100%;
      background: var(--lime-bg);
      border: 1px solid var(--lime-border);
      color: var(--lime);
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 10px;
      cursor: pointer;
    }

    .target-btn:hover {
      background: rgba(218, 233, 149, 0.25);
    }

    .target-info {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .target-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .target-info-text {
      font-size: 11px;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .target-clear-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Noto Sans Mono', monospace;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      flex-shrink: 0;
      padding: 2px 4px;
    }

    .target-clear-btn:hover {
      color: var(--text);
    }

    /* Targeting */
    .targeting-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .targeting-text {
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-mark">K</div>
        <div>
          <div class="logo-text">Kameleoon</div>
          <div class="logo-sub">CRO Bridge</div>
        </div>
      </div>
      <span id="daemon-badge" class="status-badge status-disconnected">Offline</span>
    </header>

    <div class="card">
      <div class="toggle-row">
        <span class="toggle-label">Enable injection</span>
        <label class="switch">
          <input type="checkbox" id="toggle-enabled" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Target Tab</div>
      <button id="target-tab-btn" class="target-btn">🎯 Target This Tab</button>
      <div id="target-info" class="target-info">
        <div class="target-info-row">
          <span id="target-info-text" class="target-info-text">—</span>
          <button id="target-clear-btn" class="target-clear-btn">Clear</button>
        </div>
      </div>
    </div>

    <div class="card" id="targeting-card" style="display: none;">
      <div class="section-label">Targeting</div>
      <div class="targeting-row">
        <span id="targeting-badge" class="status-badge status-disconnected">—</span>
        <span id="targeting-label" class="targeting-text">Evaluating…</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
